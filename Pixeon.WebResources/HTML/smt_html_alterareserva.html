        function GetCrmParameters() {
            var vals = new Array();
            if (location.search != "") {
                vals = location.search.substr(1).split("&");
                for (var i in vals) {
                    vals[i] = vals[i].replace(/\+/g, " ").split("=");
                }
                var found = false;
                for (var i in vals) {
                    if (vals[i][0].toLowerCase() == "data") {
                        parameters = decodeURIComponent(vals[i][1].replace(/\+/g, " "));
                        parameters = JSON.parse(decodeURIComponent(parameters));
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    //Parâmetros não foram passados
                }
            }
            else {
                //Parâmetros não foram passados
            }
        }

        function updateEntity(cancelamento, id, MinutoTermino, MinutoInicio, HoraTermino, HoraInicio) {
            var result = null;
            var endtime = null;
            var starttime = null;
            var dateStart = null;
            var dateEnd = null;

            var req = new XMLHttpRequest();
            req.open("GET", "https://pixeondev.crm2.dynamics.com/api/data/v9.1/bookableresourcebookings(" + id + ")?$select=endtime,starttime", false);
            req.setRequestHeader("OData-MaxVersion", "4.0");
            req.setRequestHeader("OData-Version", "4.0");
            req.setRequestHeader("Accept", "application/json");
            req.setRequestHeader("Content-Type", "application/json; charset=utf-8");
            req.onreadystatechange = function () {
                if (this.readyState === 4) {
                    req.onreadystatechange = null;
                    if (this.status === 200) {
                        result = JSON.parse(this.response);
                        endtime = result["endtime"];
                        starttime = result["starttime"];
                    } else {
                        Xrm.Utility.alertDialog(this.statusText);
                    }
                }
            };
            req.send();
            if (starttime != null) {
                dateStart = new Date(starttime);
                dateStart.setHours(HoraInicio);
                dateStart.setMinutes(MinutoInicio);
            }
            if (endtime != null) {
                dateEnd = new Date(starttime);
                dateEnd.setHours(HoraTermino);
                dateEnd.setMinutes(MinutoTermino);
            }
            var entity = {};
            if (cancelamento != null) {
                entity.smt_tx_description = cancelamento;
            }
            if (dateStart != null) {
                entity.starttime = dateStart;
            }
            if (dateEnd != null) {
                entity.endtime = dateEnd;
            }

            var req = new XMLHttpRequest();
            req.open("PATCH", "https://pixeondev.crm2.dynamics.com/api/data/v9.1/bookableresourcebookings(" + id + ")", false);
            req.setRequestHeader("OData-MaxVersion", "4.0");
            req.setRequestHeader("OData-Version", "4.0");
            req.setRequestHeader("Accept", "application/json");
            req.setRequestHeader("Content-Type", "application/json; charset=utf-8");
            req.onreadystatechange = function () {
                if (this.readyState === 4) {
                    req.onreadystatechange = null;
                    if (this.status === 204) {
                        //Success - No Return Data - Do Something
                    } else {
                        Xrm.Utility.alertDialog(this.statusText);
                    }
                }
            };
            req.send(JSON.stringify(entity));
        }
