    <!--Chamadas API-->
    <script>
        function createJIRAissue(D365issue) {
            debugger;

			var organizationSettings = parent.Xrm.Utility.getGlobalContext().organizationSettings;
			var url = null;
            var orgId = organizationSettings.organizationId;
            // url do flow de dev
			if (orgId === "880d73f4-c43a-4bdd-8f79-c414ad165e96") {
				url = "https://prod-22.brazilsouth.logic.azure.com:443/workflows/9bec0626b67a485291ab9b1ac3355453/triggers/manual/paths/invoke?api-version=2016-06-01&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=sw2yjEZWQ1GR9GWvUB1ui_XgRQnftSP_eCxgLQaLsU4";
			}
            else if (orgId === "8bd44f1b-218e-49f4-a4a6-1975b0dd4c7e") {
                // url do flow de produção
				url = "https://prod-16.brazilsouth.logic.azure.com:443/workflows/c68517cb7730444598b640aedbd342ca/triggers/manual/paths/invoke?api-version=2016-06-01&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=h8kadJ6r5XtmFg-y8NaLH1-DDV8HvS68b4TfL9dfk0A";
            }

            var settings = {
                "url": url,
                "method": "POST",
                "timeout": 0,
                "headers": {
                    "Content-Type": "application/json"
                },
                "data": JSON.stringify({ "project": "SSD", "issueid": D365issue.id }),
            };

            $.ajax(settings).done(function (data) {
                $('#status').empty();
                $('#status').append("<div class='alert alert-success'><strong>Issue Importada com sucesso. </strong> Redirecionando...</div>");
                parent.location.reload();
            }).fail(function (jqXHR, textStatus) {
                $('#status').empty();
                $('#status').append("<div class='alert alert-danger'><strong>Falha na integração com o Jira: </strong>" + jqXHR.responseText + "</div>");
                $('.btn').prop("disabled", false);
                $('.btn').removeClass("disabled");
                $('.form-control').prop("disabled", false);
                $('.form-control').removeClass("disabled");
            });
        }


        function integrateJIRAissue(JIRAkey, D365issue) {
            debugger;

			var organizationSettings = parent.Xrm.Utility.getGlobalContext().organizationSettings;
			var url = null;
            var orgId = organizationSettings.organizationId;
            // Id de dev
			if (orgId === "880d73f4-c43a-4bdd-8f79-c414ad165e96") {
				url = "https://prod-14.brazilsouth.logic.azure.com:443/workflows/05449fa75c324757892a2439d19781ca/triggers/manual/paths/invoke?api-version=2016-06-01&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=AmDAnmlR3LOTUdtvhcopD0IuQkJtV5pYJeI5bitkp5U";
			}
            else if (orgId === "8bd44f1b-218e-49f4-a4a6-1975b0dd4c7e") {
                // id de produção
				url = "https://prod-10.brazilsouth.logic.azure.com:443/workflows/31405d89a6654032aa0fc7a2e3e877f4/triggers/manual/paths/invoke?api-version=2016-06-01&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=R32qWPy585YkpY8JTEYog5of-R9jrgud0VnusPRuSr0";
			}
            var settings = {
                "url": url,
                "method": "POST",
                "timeout": 0,
                "headers": {
                    "Content-Type": "application/json"
                },
                "data": JSON.stringify({ "key": JIRAkey, "issueid": D365issue.id }),
            };

            $.ajax(settings).done(function (data) {
                $('#status').empty();
                $('#status').append("<div class='alert alert-success'><strong>Issue Importada com sucesso. </strong> Redirecionando...</div>");
                parent.location.reload();
            }).fail(function (jqXHR, textStatus) {
                $('#status').empty();
                $('#status').append("<div class='alert alert-danger'><strong>Falha na integração com o Jira: </strong>" + jqXHR.responseText + "</div>");
                $('.btn').prop("disabled", false);
                $('.btn').removeClass("disabled");
                $('.form-control').prop("disabled", false);
                $('.form-control').removeClass("disabled");
            });
        }
    </script>



    <!-- Esconder botão e mostrar loader-->
    <script>
        $(document).ready(function () {
            $('#btnCreateIssue').click(function () {
                debugger;
                $('.btn').prop("disabled", true);
                $('.btn').addClass("disabled");
                $('.form-control').prop("disabled", true);
                $('.form-control').addClass("disabled");
                $('#status').empty();
                $('#status').append("<p id='wait'>Aguarde<br><img src='smt_gif_ajaxloader'></p>")
                var D365issue = getFields();
                createJIRAissue(D365issue);
            });

            $('#btnIntegrateIssue').click(function () {
                debugger;
                $('.btn').prop("disabled", true);
                $('.btn').addClass("disabled");
                $('.form-control').prop("disabled", true);
                $('.form-control').addClass("disabled");
                $('#status').empty();
                $('#status').append("<p id='wait'>Aguarde<br><img src='smt_gif_ajaxloader'></p>")
                var D365issue = getFields();
                var JIRAKey = $('#issuekey').val();
                integrateJIRAissue(JIRAKey, D365issue);
            });
        });
    </script>
